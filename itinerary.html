<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Activate Kuala Lumpur team building itinerary builder">
<title>Activate Itinerary Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
.desk{container-type:inline-size;container-name:desk}
@container desk (max-width:640px){
  .desk .doc .body{padding:20px 16px 28px}
  .desk .doc .tblwrap{overflow:visible}
  .desk .doc table.ros{min-width:0;display:block}
  .desk .doc table.ros thead{display:none}
  .desk .doc table.ros tbody{display:block}
  .desk .doc table.ros tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 6px;border-bottom:1px solid #E1E6E9}
  .desk .doc table.ros td{padding:0;border:0;width:auto!important;background:none!important;white-space:normal}
  .desk .doc table.ros td.t{grid-column:1;font-weight:700;font-size:11.5px}
  .desk .doc table.ros td.d{grid-column:2;text-align:right;color:#4A5560}
  .desk .doc table.ros td.a{grid-column:1/-1;font-size:12.5px}
  .desk .doc table.ros td:last-child{grid-column:1/-1;color:#4A5560}
  .desk .doc table.ros tr.game{background:#E4FAFB}
  .desk .doc table.ros tr:nth-child(even){background:#F5F8F9}
  .desk .doc table.ros tr.game:nth-child(even){background:#E4FAFB}
}
/* Layout: dark brand bar, left = 2-step builder panel, right = live A4 itinerary preview on a "desk" */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#0C1117; --muted:#56636D; --line:#D6DFE2;
  --accent:#009AA6; --accent-soft:#DDF6F8; --brand:#00FFFF; --bar:#0C1117;
  --warn:#8A5300; --warn-bg:#FFF1D9; --ok:#0B7A4B; --ok-bg:#DFF5EA; --err:#B3261E;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090D11; --surface:#121A21; --ink:#E4ECEF; --muted:#8D9BA5; --line:#24313B;
  --accent:#22E3EE; --accent-soft:#0D2A2F; --bar:#05080B;
  --warn:#FFC266; --warn-bg:#2E2210; --ok:#5BD69B; --ok-bg:#10281D; --err:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090D11; --surface:#121A21; --ink:#E4ECEF; --muted:#8D9BA5; --line:#24313B;
  --accent:#22E3EE; --accent-soft:#0D2A2F; --bar:#05080B;
  --warn:#FFC266; --warn-bg:#2E2210; --ok:#5BD69B; --ok-bg:#10281D; --err:#FF8A80; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.topbar{background:var(--bar);color:#fff;border-bottom:3px solid var(--brand)}
.topbar .in{max-width:1440px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.topbar b{font-family:var(--display);font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.topbar b span{color:var(--brand)}
.topbar small{color:#9FB0BA;font-size:13px}
.wrap{max-width:1440px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.step h2{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.step h2 .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;text-align:center;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:22px 14px;text-align:center;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.drop input{display:none}
.status{font-size:13.5px;padding:9px 11px;border-radius:7px;background:var(--accent-soft);color:var(--ink)}
.status.err{background:var(--warn-bg);color:var(--warn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:440px){.grid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f .req{color:var(--accent)}
input,select{font:inherit;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.bad{border-color:var(--err)}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.out{display:block;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--accent-soft);border:1px solid var(--line);border-radius:7px;padding:8px 10px;line-height:1.3}
.out .hint{display:block;margin:0}
.hint{font-size:12px;margin-left:4px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.choice input{width:auto;margin-top:3px;accent-color:var(--accent)}
.choice b{display:block;font-size:15px}
.choice span{font-size:13px;color:var(--muted)}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice.off{opacity:.5;cursor:not-allowed}
.choice:has(input:disabled){cursor:not-allowed}
.choice:has(input:disabled:not(:checked)){opacity:.5}
select:disabled{opacity:.7;cursor:not-allowed}
.sub{display:flex;flex-direction:column;gap:8px;padding-left:14px;border-left:2px solid var(--line)}
.sub>.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13.5px;border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.note.buy{background:var(--warn-bg);color:var(--warn)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note b{font-weight:600}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:600;font-size:14px}
details.more .grid{margin-top:12px}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:7px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:wait}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
.linkbtn:focus-visible{outline:2px solid var(--accent)}

.stage{min-width:0;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
@media (max-width:980px){.stage{position:static}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.toolbar .l{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.toolbar .r{display:flex;flex-wrap:wrap;gap:8px}
.warnline{font-size:13px;color:var(--warn);background:var(--warn-bg);padding:8px 11px;border-radius:7px}
.desk{background:#5B6770;border-radius:10px;padding:22px;overflow:auto;max-height:calc(100vh - 120px)}
@media (max-width:980px){.desk{max-height:none;padding:10px}}
.desk.editing .doc{outline:3px dashed var(--brand);outline-offset:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:20}
@media (prefers-reduced-motion:no-preference){.drop{transition:all .15s}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .topbar,.panel,.toolbar,#warn,#toast{display:none!important}
  .wrap{display:block;padding:0;max-width:none}
  .stage{position:static}
  .desk{background:none;padding:0;max-height:none;overflow:visible;border-radius:0}
  .doc{box-shadow:none!important;max-width:none!important;outline:none!important}
  .doc .hdr,.doc .tag,.doc table.ros th,.doc .sumbox,.doc table.ros tr td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<style id="docCss">
.doc{background:#fff;color:#1A1F24;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:13px;line-height:1.45;max-width:794px;margin:0 auto;box-shadow:0 6px 30px rgba(0,0,0,.25)}
.doc *{box-sizing:border-box}
.doc .hdr{display:block;width:100%;height:auto;background:#0C1117;border-bottom:3px solid #00E5EA}
.doc .body{padding:26px 48px 40px}
.doc .refrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px}
.doc .refrow b{font-weight:700}
.doc .tags{display:flex;gap:14px;align-items:center}
.doc .tag{background:#00F0F0;color:#0C1117;font-weight:700;font-size:10px;padding:2px 7px;letter-spacing:.04em}
.doc h1{font-size:23px;line-height:1.25;margin:18px 0 14px;font-weight:700;color:#0C1117}
.doc table.kv{width:100%;border-collapse:collapse;margin-bottom:16px}
.doc table.kv td{border-top:1px solid #DADFE3;padding:5px 6px;font-size:12px;vertical-align:top}
.doc table.kv tr:last-child td{border-bottom:1px solid #DADFE3}
.doc table.kv td:first-child{width:26%;font-weight:700;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;padding-top:6px}
.doc table.kv td.em{font-style:italic;color:#4A5560}
.doc table.kv td.st{font-weight:700}
.doc h3{font-size:12.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:20px 0 8px;color:#0C1117}
.doc h4{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:14px 0 2px}
.doc .sumbox{background:#EAF7F8;border-left:3px solid #00D3DA;padding:9px 13px;font-style:italic;color:#2D3942}
.doc p{margin:0 0 8px}
.doc ul{list-style:none;padding:0;margin:4px 0 8px}
.doc ul li{position:relative;padding-left:15px;margin:4px 0}
.doc ul li::before{content:"";position:absolute;left:2px;top:.55em;width:6px;height:6px;background:#00CED6}
.doc ol{margin:4px 0 4px 18px;padding-left:16px}
.doc ol li{margin:2px 0}
.doc ol li::before{content:none}
.doc .tblwrap{overflow-x:auto}
.doc table.ros{width:100%;border-collapse:collapse;font-size:11.5px;min-width:560px}
.doc table.ros th{background:#0C1117;color:#fff;text-align:left;font-size:10px;letter-spacing:.05em;padding:7px 8px}
.doc table.ros td{padding:7px 8px;border-bottom:1px solid #E1E6E9;vertical-align:top}
.doc table.ros tr:nth-child(even) td{background:#F5F8F9}
.doc table.ros tr.game td{background:#E4FAFB;font-weight:700}
.doc table.ros td.t{white-space:nowrap;font-variant-numeric:tabular-nums;width:21%}
.doc table.ros td.d{white-space:nowrap;width:11%}
.doc table.ros td.a{font-weight:700;width:28%}
.doc table.ros tr{page-break-inside:avoid;break-inside:avoid}
.doc .small{font-size:11px;color:#5A6670;margin-top:8px}
.doc .sesshead{font-size:11.5px;color:#4A5560;margin-bottom:4px}
.doc .sign{margin-top:22px}
.doc .sign p{margin:0}
.doc .blank{color:#B04A3C}
.doc .avoid{break-inside:avoid;page-break-inside:avoid}
</style>

</head>
<body>
<header class="topbar"><div class="in"><b>Activate <span>KL</span> · Itinerary Builder</b><small>Quotation in, client-ready team building itinerary out</small></div></header>

<main class="wrap">
  <aside class="panel">
    <!-- STEP 1 -->
    <section class="step" aria-labelledby="s1h">
      <h2 id="s1h"><span class="n">1</span>Event details</h2>
      <div class="seg" role="group" aria-label="How to add details">
        <button type="button" id="tabUp" aria-pressed="true">Upload quotation</button>
        <button type="button" id="tabMan" aria-pressed="false">Key in manually</button>
      </div>
      <div id="upPane">
        <label class="drop" id="drop" for="qfile">
          <strong>Drop the quotation here, or tap to choose</strong>
          PDF or text file. Fields are filled in below for you to check.
          <input type="file" id="qfile" accept=".pdf,.txt">
        </label>
      </div>
      <div id="qstatus" class="status" hidden></div>

      <div class="grid" id="manPane">
        <label class="f full"><span>Person in charge </span><input id="pic" autocomplete="off"></label>
        <label class="f"><span>Email</span><input id="email" type="email" autocomplete="off"></label>
        <label class="f"><span>Phone <span class="hint">Optional</span></span><input id="phone" autocomplete="off"></label>
        <label class="f full"><span>Company name</span><input id="company" autocomplete="off"></label>
        <label class="f full"><span>Event date</span><input id="date" type="date"></label>
        <label class="f"><span>Event start</span><input id="start" type="time" step="300"></label>
        <label class="f"><span>Event end <span class="hint">Blank = auto</span></span><input id="end" type="time" step="300"></label>
        <label class="f"><span>Session time</span><select id="sessMin"><option value="60">60 minutes</option><option value="90" selected>90 minutes</option><option value="120">120 minutes</option></select></label>
        <label class="f"><span>No. of pax <span class="hint">Players</span></span><input id="pax" type="number" min="1" max="400" inputmode="numeric"></label>
        <label class="f"><span>Non-players</span><input id="nonp" type="number" min="0" inputmode="numeric" placeholder="nil"></label>
        <div class="f"><span>Groups <span class="hint">Auto · max 5 each</span></span><output id="groupsOut" class="out">—</output></div>
        <div class="full" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="hint" id="sampleNote">Showing sample data from the Hap Seng itinerary.</span>
          <button type="button" class="linkbtn" id="clearBtn">Clear all fields</button>
        </div>
      </div>
    </section>

    <!-- STEP 2 -->
    <section class="step" aria-labelledby="s2h">
      <h2 id="s2h"><span class="n">2</span>Game format</h2>
      <div id="lockNote" class="note ok" hidden></div>
      <div class="choices" role="radiogroup" aria-label="Number of sessions">
        <label class="choice"><input type="radio" name="sess" id="sess2" value="2" checked><div><b>2 sessions</b><span>Session 1 unlocks games, Session 2 is the main game where unlocks give more chances to score.</span></div></label>
        <label class="choice"><input type="radio" name="sess" id="sess1" value="1"><div><b>1 session</b><span>Straight into the main game.</span></div></label>
      </div>
      <div class="sub" id="modeBox" hidden>
        <div class="lbl">1-session mode</div>
        <label class="choice"><input type="radio" name="mode" id="modePts" value="points" checked><div><b>Main game: points</b><span>Teams fight for the highest total points.</span></div></label>
        <label class="choice" id="teamChoice"><input type="radio" name="mode" id="modeTeam" value="team"><div><b>Team mode: wins</b><span id="teamSpan">Teams play for the most wins. 60 pax and below only.</span></div></label>
      </div>
      <div id="venueNote" class="note"></div>
      <label class="choice"><input type="checkbox" id="debrief"><div><b>Add closing debrief</b><span>10 minutes at the lobby. Last item of the event.</span></div></label>

      <details class="more">
        <summary>Itinerary settings</summary>
        <div class="grid">
          
          <label class="f"><span>Locked games <span class="hint">2 sessions</span></span><input id="locked" type="number" min="1" value="29"></label>
          <label class="f full"><span>Food &amp; beverages</span><select id="fnb"><option>Provided by the organisation</option><option>Arranged by Activate Kuala Lumpur</option><option>Not included</option></select></label>
          <label class="f full" id="brkWrap"><span>Refreshment break <span class="hint">1 session</span></span><select id="brk1"><option value="0">No break</option><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">60 minutes</option></select></label>
          <label class="f"><span>Reference no.</span><input id="ref" placeholder="Auto"></label>
          <label class="f"><span>Status</span><select id="status"><option>Confirmed</option><option>Tentative</option><option>Draft</option></select></label>
          <label class="f full"><span>Winners' gift</span><input id="gift" value="Goodie bag"></label>
        </div>
      </details>
    </section>
  </aside>

  <!-- STEP 3 / PREVIEW -->
  <section class="stage" aria-label="Itinerary preview">
    <div class="toolbar">
      <div class="l"><span class="n" style="display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:15px">3</span>Itinerary</div>
      <div class="r">
        <button type="button" class="btn" id="editBtn" aria-pressed="false">Edit text</button>
        <button type="button" class="btn" id="copyBtn">Copy text</button>
        <button type="button" class="btn" id="htmlBtn">Download HTML</button>
        <button type="button" class="btn" id="printBtn">Print</button>
        <button type="button" class="btn primary" id="pdfBtn">Download PDF</button>
      </div>
    </div>
    <div id="warn" class="warnline" hidden></div>
    <div class="desk" id="desk"><article class="doc" id="doc"></article></div>
  </section>
</main>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>

const $ = id => document.getElementById(id);
const BUYOUT_MIN = 85, TEAM_MAX = 60, GROUP_MAX = 5;
let edited = false;
let quoteBuyout = false; // set when the billing app says the quotation has a venue buy-out

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toMin = t => { if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+m; };
const toHHMM = m => String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function fmt(m, mer=true){ m = ((m%1440)+1440)%1440; let h=Math.floor(m/60), mm=m%60, ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+String(mm).padStart(2,"0")+(mer?" "+ap:""); }
const ap = m => (Math.floor(((m%1440)+1440)%1440/60)>=12?"PM":"AM");
function range(a,b){ return ap(a)===ap(b) ? fmt(a,false)+" – "+fmt(b) : fmt(a)+" – "+fmt(b); }
const fullRange = (a,b) => fmt(a)+" – "+fmt(b);
function niceDate(iso){ if(!iso) return ""; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).replace(/^(\w+) /,"$1, "); }
const shortCo = c => (c||"").replace(/\(.*?\)/g,"").replace(/\b(Sdn\.?\s*Bhd\.?|Berhad|Bhd\.?|Pte\.?\s*Ltd\.?|Ltd\.?|Inc\.?|PLT)\s*$/i,"").trim();
function groupsText(p,s){ const g=Math.max(1,Math.ceil(p/s)), base=Math.floor(p/g), rem=p%g;
  if(rem===0) return {g, txt:`${g} group${g>1?"s":""} of ${base}`};
  return {g, txt:`${rem} group${rem>1?"s":""} of ${base+1} and ${g-rem} of ${base}`}; }
const B = v => v ? esc(v) : '<span class="blank">[to fill]</span>';
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); }

/* ---------- state from form ---------- */
function read(){
  const pax = parseInt($("pax").value)||0;
  const sessions = $("sess1").checked ? 1 : 2;
  let mode = sessions===2 ? "unlock" : ($("modeTeam").checked ? "team" : "points");
  if(mode==="team" && pax>TEAM_MAX) mode="points";
  return { pic:$("pic").value.trim(), email:$("email").value.trim(), phone:$("phone").value.trim(),
    company:$("company").value.trim(), date:$("date").value, start:toMin($("start").value), end:toMin($("end").value),
    dur:parseInt($("sessMin").value)||90, pax, nonp:parseInt($("nonp").value)||0, sessions, mode,
    gsize:GROUP_MAX, locked:parseInt($("locked").value)||29,
    fnb:$("fnb").value, brk1:parseInt($("brk1").value)||0, ref:$("ref").value.trim(), status:$("status").value,
    gift:$("gift").value.trim()||"Goodie bag", debrief:$("debrief").checked, buyout: pax>=BUYOUT_MIN || quoteBuyout };
}

/* ---------- run of show ---------- */
function buildRos(s, G){
  const g = G.g, store = s.buyout ? "Lockers or lounge (full buyout, whole venue is theirs)" : "Lockers provided at the venue";
  const fnbDet = s.fnb==="Not included" ? "Rest and regroup" : (s.fnb==="Arranged by Activate Kuala Lumpur" ? "F&B arranged by Activate Kuala Lumpur" : "F&B provided by the organisation");
  const pre = [
    {d:10,a:"Arrival & welcome speech",t:"Group arrives; welcome address"},
    {d:10,a:"Band briefing",t:"How the player bands and locker bands work"},
    {d:10,a:"Group segregation",t:`${G.txt} per the organisation's list; team leaders confirmed`},
    {d:10,a:"Store belongings",t:store},
    {d:10,a:"Sign-in & band assignment",t:"iPad sign-in, then each player is assigned a band"},
  ];
  let rows;
  if(s.mode==="unlock"){
    rows = [...pre,
      {d:10,a:"Session 1 briefing",t:"Rules and objective for the unlock round"},
      {d:s.dur,a:"Game Session 1: Unlock",t:`Teams unlock as many of the ${s.locked} locked games as possible`,game:1,key:"s1"},
      {d:60,a:"Break & light refreshments",t:fnbDet,flex:[30,120],key:"brk"},
      {d:30,a:"Session 2 briefing",t:"How Session 1 unlocks give teams more scoring chances"},
      {d:s.dur,a:"Game Session 2: Main game",t:"Teams play to maximise points",game:1,key:"s2"},
    ];
  } else {
    const team = s.mode==="team";
    rows = [...pre,
      {d:team?15:10,a:"Game briefing",t:team?"Team mode rules: how wins are counted":"Rules and scoring for the main game"},
      {d:s.dur,a:team?"Game Session: Team mode":"Game Session: Main game",t:team?"Teams play together to rack up as many wins as possible":"Teams fight for the highest total points",game:1,key:"s1"},
    ];
    if(s.brk1) rows.push({d:s.brk1,a:"Break & light refreshments",t:fnbDet,flex:[15,90],key:"brk"});
  }
  rows.push({d:15,a:"Band return",t:"Team leaders return their group's bands at the lobby, group by group"});
  rows.push({d:60,a:"Group debrief & merchandise",t:"Each group shares learnings; merchandise redemption",flex:[30,90],key:"deb"});
  rows.push({d:15,a:"Winners & close",t:`Winning team announced; ${s.gift.toLowerCase()} presented${s.debrief?"":"; event ends"}`});
  if(s.debrief) rows.push({d:10,a:"Closing debrief",t:"Quick debrief at the lobby; event ends",key:"cd"});

  // fit to event window
  let warn = "";
  const start = s.start ?? 600;
  let total = rows.reduce((x,r)=>x+r.d,0);
  if(s.end!=null){
    let win = s.end - start; if(win<=0) win += 1440;
    let slack = win - total;
    for(const r of rows.filter(r=>r.flex)){ if(!slack) break;
      const nd = Math.min(r.flex[1], Math.max(r.flex[0], r.d+slack)); slack -= (nd-r.d); r.d = nd; }
    if(slack>0) warn = `The event window is ${slack} min longer than the run of show. Extend the end time or add a break.`;
    if(slack<0) warn = `The run of show needs ${-slack} min more than the event window. It now ends at ${fmt(start+win-slack)}.`;
  }
  let t = start; rows.forEach(r=>{ r.s=t; r.e=t+r.d; t=r.e; });
  return {rows, start, end: s.end!=null && !warn.startsWith("The run of show") ? (s.end) : t, warn};
}

function qs(msg,err){ const q=$("qstatus"); q.hidden=false; q.className="status"+(err?" err":""); q.textContent=msg; }

async function pdfText(file){
  if(!window.pdfjsLib) throw new Error("PDF reader did not load. Key the details in manually.");
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let out=[];
  for(let i=1;i<=Math.min(pdf.numPages,6);i++){
    const pg=await pdf.getPage(i); const tc=await pg.getTextContent();
    let line="", lastY=null;
    tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); if(lastY!==null && Math.abs(y-lastY)>3){ out.push(line); line=""; } line+=(line?" ":"")+it.str; lastY=y; });
    out.push(line);
  }
  return out.join("\n").replace(/[ \t]+/g," ");
}

const SCHEMA_PROMPT = `You read a quotation or booking document for Activate Kuala Lumpur, a team-building game venue. Extract these fields and reply with JSON only:
{"picName": person in charge / contact / attention name (string or null),
 "email": string or null, "phone": string or null,
 "company": client company full name (string or null),
 "eventDate": "YYYY-MM-DD" or null,
 "startTime": "HH:MM" 24-hour event start or null, "endTime": "HH:MM" 24-hour event end or null,
 "sessions": 1 or 2 (number of game sessions) or null,
 "sessionMinutes": minutes per game session (number) or null,
 "pax": number of players (number) or null, "nonPlayers": number or null}
Use null when a field is not in the document. Do not guess. The client is the customer, never Activate itself.`;

function regexParse(t){
  const o={};
  const em=t.match(/[\w.+-]+@[\w-]+\.[\w.]+/); if(em) o.email=em[0];
  const ph=t.match(/(\+?6?0\d{1,2})[-\s]?\d{3,4}[-\s]?\d{3,4}/); if(ph) o.phone=ph[0];
  const co=t.match(/([A-Z][A-Za-z0-9&.,'() -]{2,80}?(?:Sdn\.?\s*Bhd\.?|Berhad|Bhd\.?))/); if(co) o.company=co[1].replace(/^(To|Client|Company|Bill To)\s*[:\-]?\s*/i,"").trim();
  const pic=t.match(/(?:Attn|Attention|Contact(?: Person)?|Person in Charge|PIC)\s*[:\-]?\s*([A-Z][A-Za-z.' ]{2,40})/i); if(pic) o.picName=pic[1].trim();
  const px=t.match(/(\d{1,3})\s*(?:pax|players|persons|people|participants)/i); if(px) o.pax=+px[1];
  const ss=t.match(/(\d)\s*sessions?/i); if(ss) o.sessions=+ss[1];
  const sm=t.match(/(\d{2,3})\s*(?:-|\s)?min(?:ute)?s?/i); if(sm) o.sessionMinutes=+sm[1];
  const months="january february march april may june july august september october november december".split(" ");
  const dm=t.match(/(\d{1,2})(?:st|nd|rd|th)?\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?,?\s+(\d{4})/i);
  const dn=t.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if(dm){ const mi=months.findIndex(m=>m.startsWith(dm[2].toLowerCase()))+1; o.eventDate=`${dm[3]}-${String(mi).padStart(2,"0")}-${dm[1].padStart(2,"0")}`; }
  else if(dn){ o.eventDate=`${dn[3]}-${dn[2].padStart(2,"0")}-${dn[1].padStart(2,"0")}`; }
  const tm=[...t.matchAll(/(\d{1,2})[:.](\d{2})\s*(am|pm)/gi)];
  const cv=m=>{ let h=+m[1]%12; if(/pm/i.test(m[3])) h+=12; return String(h).padStart(2,"0")+":"+m[2]; };
  if(tm[0]) o.startTime=cv(tm[0]); if(tm[1]) o.endTime=cv(tm[1]);
  return o;
}

async function handleFile(file){
  qs(`Reading ${file.name}…`);
  try{
    const isImg=/^image\//.test(file.type), isPdf=/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name);
    let text="";
    if(isPdf) text=await pdfText(file); else if(!isImg) text=await file.text();
    if(!isImg && !text.trim()){ qs("No text found in this file. It may be a scanned PDF. Key in the details manually.",true); return; }
    if(isImg){ qs("Images can't be read here. Upload the PDF, or key in the details.",true); return; }
    const data=regexParse(text), how="read from the quotation";
    const keys=["picName","email","company","eventDate","startTime","pax"], labels={picName:"person in charge",email:"email",company:"company",eventDate:"event date",startTime:"start time",pax:"pax"};
    ["pic","email","phone","company","date","start","end","pax","nonp"].forEach(id=>$(id).value="");
    fill(data);
    const missing=keys.filter(k=>data[k]==null||data[k]==="").map(k=>labels[k]);
    setTab(false);
    qs(missing.length ? `Details ${how}. Please fill in: ${missing.join(", ")}.` : `Details ${how}. Check the fields below before sending.`, missing.length>0);
  }catch(e){ qs((e && e.message) || "Couldn't read this file. Key in the details manually.",true); }
}

/* PDF page layout: A4, 12mm top (pages 2+) and 14mm bottom margin on every page.
   Page 1 keeps the full-width header at the very top. Blocks are never cut in half. */
function paginateForPdf(root){
  const rw=root.getBoundingClientRect().width, MM=rw/210;
  const PAGE=Math.floor(297*MM)-1, TOP=Math.round(12*MM), BOT=Math.round(14*MM);
  const body=root.querySelector(".body");
  // zebra rows as fixed colours, so spacer rows can't flip the striping
  body.querySelectorAll("table.ros tbody tr").forEach((tr,i)=>{ if(!tr.classList.contains("game")) tr.querySelectorAll("td").forEach(td=>td.style.background=i%2?"#F5F8F9":"#FFFFFF"); });
  const units=[];
  [...body.children].forEach(el=>{
    if(el.classList.contains("tblwrap") && el.getBoundingClientRect().height > PAGE-TOP-BOT) el.querySelectorAll("tr").forEach(tr=>units.push(tr)); // only split a table that can't fit on one page
    else units.push(el);
  });
  const rt=()=>root.getBoundingClientRect().top;
  const top=u=>u.getBoundingClientRect().top-rt(), bot=u=>u.getBoundingClientRect().bottom-rt();
  const isHead=u=>/^H[34]$/.test(u.tagName)||(u.parentElement&&u.parentElement.tagName==="THEAD");
  let page=0, guard=0;
  for(let i=0;i<units.length && guard<500;i++){
    const u=units[i];
    if(bot(u) <= (page+1)*PAGE-BOT) continue;
    if(bot(u)-top(u) > PAGE-TOP-BOT){ page=Math.floor(bot(u)/PAGE); continue; } // taller than a page: let it flow
    let j=i; while(j>0 && isHead(units[j-1])) j--;
    const first=units[j], target=(page+1)*PAGE+TOP;
    if(top(first) <= page*PAGE+(page>0?TOP:0)+3){ page=Math.floor(bot(u)/PAGE); continue; } // already at the top of a page
    let sp;
    if(first.tagName==="TR"){ sp=document.createElement("tr"); const td=document.createElement("td"); td.colSpan=4; td.style.cssText="padding:0;border:0;background:#fff"; sp.appendChild(td); }
    else { sp=document.createElement("div"); }
    sp.className="pgsp"; first.parentNode.insertBefore(sp,first);
    const cell=sp.tagName==="TR"?sp.firstChild:sp;
    if(sp.tagName!=="TR") sp.style.cssText="margin:0;padding:0;";
    cell.style.height=Math.max(0,target-top(first))+"px";
    // measure again: a block's own top margin pushes it lower, so correct for it
    cell.style.height=Math.max(0,parseFloat(cell.style.height)+(target-top(first)))+"px";
    page++; i=j-1; guard++;
  }
}
$("pdfBtn").onclick=async()=>{

  const btn=$("pdfBtn"); btn.disabled=true; btn.textContent="Building PDF…";

  holder.appendChild(clone); document.body.appendChild(holder);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const imgs=[...clone.querySelectorAll("img")]; await Promise.all(imgs.map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    paginateForPdf(clone);
    const blob = await html2pdf().set({margin:0,image:{type:"jpeg",quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:[]}}).from(clone).outputPdf("blob");
    await save(fileBase()+".pdf", blob);
  }catch(e){ toast("Couldn't build the PDF. Try Download HTML."); }
  finally{ holder.remove(); btn.disabled=false; btn.textContent="Download PDF"; }
};
$("printBtn").onclick=()=>window.print();
$("copyBtn").onclick=()=>{
  const txt=$("doc").innerText;
  const fallback=()=>{ const r=document.createRange(); r.selectNodeContents($("doc")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Text selected. Press Ctrl+C / Cmd+C to copy"); };
  try{ navigator.clipboard.writeText(txt).then(()=>toast("Itinerary text copied"),fallback); }catch(e){ fallback(); }
};

/* ---------- details sent from the billing app (link: itinerary.html#d=...) ---------- */
function readLink(){
  const m=location.hash.match(/[#&]d=([^&]+)/); if(!m) return null;
  try{ return JSON.parse(decodeURIComponent(m[1])); }catch(e){ return null; }
}
const fromQuote = readLink();
if(fromQuote){
  quoteBuyout = !!fromQuote.buyout;
  if(fromQuote.ref) $("ref").value = fromQuote.ref;
  if(fromQuote.status) $("status").value = fromQuote.status;
  setTab(false);
  fill(fromQuote);
  const lockS = fromQuote.sessions==1 || fromQuote.sessions==2, lockT = !!fromQuote.sessionMinutes;
  if(lockS){ $("sess1").disabled=true; $("sess2").disabled=true; }
  if(lockT){ $("sessMin").disabled=true; }
  if(lockS||lockT){
    const ln=$("lockNote"); ln.hidden=false;
    ln.innerHTML=`<div><b>Locked to the quotation.</b> ${lockS?`${fromQuote.sessions} session${fromQuote.sessions==1?"":"s"}`:""}${lockS&&lockT?" × ":""}${lockT?`${$("sessMin").value} minutes`:""}. Session setup follows the quotation and can't be changed here.</div>`;
  }
  const miss=[["picName","person in charge"],["email","email"],["eventDate","event date"],["startTime","start time"],["pax","pax"]].filter(([k])=>!fromQuote[k]).map(x=>x[1]);
  qs(`Filled in from ${fromQuote.ref||"the quotation"}${fromQuote.company?" ("+fromQuote.company+")":""}. ${miss.length?"Please fill in: "+miss.join(", ")+". ":""}${lockS?"Sessions follow the quotation.":"Choose 1 or 2 sessions in Step 2."}`, miss.length>0);
  document.title = "Itinerary · "+(fromQuote.ref||"Activate");
} else {
/* ---------- sample data (from the Hap Seng itinerary) ---------- */
Object.entries({pic:"Pauline Teh",email:"tehpl@hapseng.com",phone:"013-3303226",company:"Hap Seng Trucks Distribution Sdn Bhd",date:"2026-12-05",start:"10:00",end:"17:00",pax:"85"}).forEach(([k,v])=>$(k).value=v);
setTab(true);
render();
}
</script>
